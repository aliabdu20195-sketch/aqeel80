const csvCell=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function exportItems(){
const csv='﻿'+['id','name','barcode','category','unit','cost','price','stock','min'].join(',')+'\n'+

function parseCsvLine(l){
const out=[];let cur='',inQ=false;
for(let i=0;i<l.length;i++){
const ch=l[i];
if(inQ){
if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else inQ=false;}
else cur+=ch;
}else{
if(ch==='"')inQ=true;
else if(ch===','){out.push(cur);cur='';}
else cur+=ch;
}
}
out.push(cur);return out;
}
function importItems(inp){
const f=inp.files[0];if(!f)return;
const r=new FileReader();
r.onload=e=>{
const lines=e.target.result.replace(/^﻿/,'').split(/\r?\n/).slice(1).filter(Boolean);
let n=0,skipped=0,impVal=0;
lines.forEach(l=>{
const c=parseCsvLine(l);if(c.length<8){skipped++;return;}
const name=(c[1]||'').trim();if(!name){skipped++;return;}
db.items.push({id:db.nextItemId++,name,barcode:c[2]||'',category:c[3]||'مستورد',unit:c[4]||'قطعة',cost:+c[5]||0,price:+c[6]||0,stock:+c[7]||0,min:+c[8]||0});n++;{const li=db.items[db.items.length-1];impVal+=li.stock*li.cost;}
});
if(impVal>0)stockAdjust(impVal,'مخزون افتتاحي - استيراد أصناف',true);save();renderTable();toast(skipped?`تم استيراد ${n} صنف، وتخطي ${skipped} سطر غير صالح`:`تم استيراد ${n} صنف ✅`);
};
r.readAsText(f);inp.value='';
}

function restoreBackup(inp){
const f=inp.files[0];if(!f)return;
const r=new FileReader();
r.onload=e=>{
try{
const d=JSON.parse(e.target.result);
if(!d.items||!d.settings)throw 0;
const dd=defaultDB();db=Object.assign({},dd,d);db.settings=Object.assign({},dd.settings,d.settings||{});['items','customers','suppliers','sales','purchases','expenses'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=dd[k];});ensureLedger();save();nav('dash');toast('تمت الاستعادة ✅');
}catch(err){toast('ملف غير صالح',false);}
};
r.readAsText(f);inp.value='';
}
/* ================= المحاسبة: القيد المزدوج (مدين / دائن) ================= */
const r2=n=>Math.round(((+n||0)+Number.EPSILON)*100)/100;
const ACC_TYPES={asset:'أصول',liability:'خصوم',equity:'حقوق الملكية',revenue:'إيرادات',expense:'مصروفات'};
const TYPE_ORDER=['asset','liability','equity','revenue','expense'];
const DEFAULT_ACCOUNTS=[
{code:'1101',name:'الصندوق',type:'asset',cash:true,sys:true},
{code:'1102',name:'البنك',type:'asset',cash:true,sys:true},
{code:'1201',name:'العملاء (الذمم المدينة)',type:'asset',sys:true},
{code:'1301',name:'المخزون',type:'asset',sys:true},
{code:'2101',name:'الموردون (الذمم الدائنة)',type:'liability',sys:true},
{code:'3101',name:'رأس المال',type:'equity',sys:true},
{code:'3102',name:'جاري المالك (المسحوبات)',type:'equity',nature:'D',sys:true},
{code:'4101',name:'إيرادات المبيعات',type:'revenue',sys:true},
{code:'4102',name:'خصم مسموح به',type:'revenue',nature:'D',sys:true},
{code:'4201',name:'خصم مكتسب',type:'revenue',sys:true},
{code:'5101',name:'تكلفة البضاعة المباعة',type:'expense',sys:true},
{code:'5201',name:'إيجار',type:'expense'},
{code:'5202',name:'رواتب',type:'expense'},
{code:'5203',name:'كهرباء',type:'expense'},
{code:'5204',name:'مياه',type:'expense'},
{code:'5205',name:'نقل',type:'expense'},
{code:'5206',name:'صيانة',type:'expense'},
{code:'5299',name:'مصروفات أخرى',type:'expense'},
{code:'5301',name:'فروقات جرد المخزون',type:'expense',sys:true}
];
const accByCode=c=>db.accounts.find(a=>a.code===c);
const accNature=a=>a.nature||((a.type==='asset'||a.type==='expense')?'D':'C');
const balOf=(a,t)=>{t=t||{d:0,c:0};return accNature(a)==='D'?r2(t.d-t.c):r2(t.c-t.d);};
const cashAccs=()=>db.accounts.filter(a=>a.type==='asset'&&a.cash);
const methodSel=id=>`<select class="inp" id="${id}">${cashAccs().map(a=>`<option value="${a.code}">${esc(a.name)}</option>`).join('')}</select>`;
const getMethod=id=>{const el=document.getElementById(id);return el&&accByCode(el.value)?el.value:'1101';};
const sortedJournal=()=>db.journal.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
function expAccCode(cat){const n=cat==='أخرى'?'مصروفات أخرى':cat;const a=db.accounts.find(x=>x.type==='expense'&&x.name===n);return a?a.code:'5299';}
function partyLabel(key){const [tab,id]=String(key).split(':');const p=(db[tab]||[]).find(x=>x.id===+id);return p?p.name:'(محذوف)';}

/* ---- محرك القيود ---- */
function applyParty(lines,sign){
lines.forEach(l=>{
if(!l.party)return;
const [tab,id]=l.party.split(':');
const p=(db[tab]||[]).find(x=>x.id===+id);if(!p)return;
const d=(l.debit||0)-(l.credit||0);
p.balance=r2(p.balance+sign*(tab==='customers'?d:-d));
});
}
function postEntry(e,opt){
e.lines=e.lines.map(l=>({acc:l.acc,debit:r2(l.debit),credit:r2(l.credit),...(l.party?{party:l.party}:{})})).filter(l=>l.debit||l.credit);
const dr=r2(e.lines.reduce((s,l)=>s+l.debit,0)),cr=r2(e.lines.reduce((s,l)=>s+l.credit,0));
if(!e.lines.length||dr!==cr)throw new Error('قيد غير متوازن: '+e.desc);
e.id=db.nextJe++;
e.partyApplied=!(opt&&opt.skipParty);
if(e.partyApplied)applyParty(e.lines,1);
db.journal.push(e);
return e;
}
function removeEntries(pred){
const keep=[];
db.journal.forEach(e=>{if(pred(e)){if(e.partyApplied)applyParty(e.lines,-1);}else keep.push(e);});
db.journal=keep;
}
function ledgerTotals(from,to){
const m={};db.accounts.forEach(a=>m[a.code]={d:0,c:0});
db.journal.forEach(e=>{
if((from&&e.date<from)||(to&&e.date>to))return;
e.lines.forEach(l=>{const t=m[l.acc]||(m[l.acc]={d:0,c:0});t.d+=l.debit||0;t.c+=l.credit||0;});
});
Object.values(m).forEach(t=>{t.d=r2(t.d);t.c=r2(t.c);});
return m;
}
function netIncome(T){return r2(db.accounts.filter(a=>a.type==='revenue'||a.type==='expense').reduce((s,a)=>s+(T[a.code]?T[a.code].c-T[a.code].d:0),0));}

/* ---- ترحيل الفواتير والعمليات ---- */
function postInvoice(inv,method,dateStr,opt){
const isS=inv.type==='sale';
const sub=r2(inv.items.reduce((s,l)=>s+l.qty*l.price,0)),disc=r2(inv.discount),total=r2(sub-disc),paid=r2(inv.paid),rem=r2(total-paid);
const cogs=r2(inv.items.reduce((s,l)=>s+l.qty*(l.cost||0),0));
const party=(isS?'customers:':'suppliers:')+inv.partyId;
const base={date:dateStr,ref:'inv:'+inv.number,auto:true};
if(isS){
postEntry({...base,desc:'فاتورة بيع '+inv.number+' - '+inv.partyName,lines:[{acc:method,debit:paid},{acc:'1201',debit:rem,party},{acc:'4102',debit:disc},{acc:'4101',credit:sub}]},opt);
if(cogs>0)postEntry({...base,desc:'تكلفة مبيعات '+inv.number,lines:[{acc:'5101',debit:cogs},{acc:'1301',credit:cogs}]},opt);
}else{
postEntry({...base,desc:'فاتورة شراء '+inv.number+' - '+inv.partyName,lines:[{acc:'1301',debit:sub},{acc:method,credit:paid},{acc:'2101',credit:rem,party},{acc:'4201',credit:disc}]},opt);
}
}
function stockAdjust(delta,desc,opening){
delta=r2(delta);if(!delta)return;
const c=opening?'3101':'5301';
postEntry({date:todayStr(),desc,ref:opening?'open':'adj',auto:true,lines:delta>0?[{acc:'1301',debit:delta},{acc:c,credit:delta}]:[{acc:c,debit:-delta},{acc:'1301',credit:-delta}]});
}
function replayLedger(){
/* تحويل بيانات النسخة القديمة: إنشاء قيود من الفواتير والمصروفات ثم مطابقة الأرصدة */
db.suppliers.forEach(s=>{s.balance=r2(-s.balance);}); /* الإشارة الجديدة: الموجب = مستحق للمورد */
const ev=db.sales.concat(db.purchases).sort((a,b)=>a.date.localeCompare(b.date));
ev.forEach(inv=>postInvoice(inv,'1101',inv.date.slice(0,10),{skipParty:true}));
db.expenses.forEach(x=>{
const code=x.acc||expAccCode(x.cat);const amt=r2(x.amount);
postEntry({date:String(x.date).slice(0,10),desc:'مصروف: '+x.desc,ref:'exp:'+x.id,auto:true,lines:[{acc:code,debit:amt},{acc:'1101',credit:amt}]},{skipParty:true});
});
const dates=ev.map(x=>x.date.slice(0,10)).concat(db.expenses.map(x=>String(x.date).slice(0,10))).sort();
const dt=dates.length?dates[0]:todayStr();
const T=ledgerTotals();
const ar=balOf(accByCode('1201'),T['1201']),ap=balOf(accByCode('2101'),T['2101']),inv=balOf(accByCode('1301'),T['1301']);
const actAR=r2(db.customers.reduce((s,c)=>s+c.balance,0)),actAP=r2(db.suppliers.reduce((s,c)=>s+c.balance,0));
const actInv=r2(db.items.reduce((s,i)=>s+i.stock*i.cost,0));
const mk=(desc,lines)=>postEntry({date:dt,desc,ref:'open',auto:true,lines},{skipParty:true});
const d1=r2(actAR-ar);
if(d1<0)mk('تحصيلات سابقة من العملاء (تسوية عند التحويل)',[{acc:'1101',debit:-d1},{acc:'1201',credit:-d1}]);
else if(d1>0)mk('رصيد افتتاحي للعملاء',[{acc:'1201',debit:d1},{acc:'3101',credit:d1}]);
const d2=r2(actAP-ap);
if(d2<0)mk('مدفوعات سابقة للموردين (تسوية عند التحويل)',[{acc:'2101',debit:-d2},{acc:'1101',credit:-d2}]);
else if(d2>0)mk('رصيد افتتاحي للموردين',[{acc:'3101',debit:d2},{acc:'2101',credit:d2}]);
const d3=r2(actInv-inv);
if(d3>0)mk('مخزون افتتاحي',[{acc:'1301',debit:d3},{acc:'3101',credit:d3}]);
else if(d3<0)mk('فروقات جرد المخزون عند التحويل',[{acc:'5301',debit:-d3},{acc:'1301',credit:-d3}]);
}
function ensureLedger(){
if(!Array.isArray(db.accounts))db.accounts=[];
const fresh=!db.accounts.length;
DEFAULT_ACCOUNTS.forEach(d=>{if((fresh||d.sys)&&!db.accounts.some(a=>a.code===d.code))db.accounts.push({...d});});
db.accounts.sort((a,b)=>a.code.localeCompare(b.code));
if(!Array.isArray(db.journal)){db.journal=[];db.nextJe=1;replayLedger();}
if(!db.nextJe)db.nextJe=db.journal.reduce((m,e)=>Math.max(m,e.id||0),0)+1;
}

let ldMode='account',ldAcc='1101',ldTab='customers',ldParty=0,ldFrom='',ldTo='';

sortedJournal().forEach(e=>e.lines.forEach(l=>{
if(l.party!==key)return;
const v=isC?l.debit-l.credit:l.credit-l.debit;
if(ldFrom&&e.date<ldFrom){open+=v;return;}
if(ldTo&&e.date>ldTo)return;
rows.push({e,dr:l.debit,cr:l.credit,v});
}));
}else{
const a=accByCode(ldAcc)||db.accounts[0];ldAcc=a.code;nd=accNature(a);
title='حساب: '+a.code+' - '+a.name;
sortedJournal().forEach(e=>e.lines.forEach(l=>{
if(l.acc!==a.code)return;
const v=nd==='D'?l.debit-l.credit:l.credit-l.debit;
if(ldFrom&&e.date<ldFrom){open+=v;return;}
if(ldTo&&e.date>ldTo)return;
rows.push({e,dr:l.debit,cr:l.credit,v});
}));
}
return{rows,open:r2(open),title,nd};
}
function balTxt(b,nd){const s=b>=0?nd:(nd==='D'?'C':'D');return fmt(Math.abs(b))+' '+(s==='D'?'مدين':'دائن');}
function renderLedger(){
const L=ledgerData();
let run=L.open,td=0,tc=0;
const body=L.rows.map(r=>{run=r2(run+r.v);td+=r.dr;tc+=r.cr;
return `<tr><td>${r.e.date}</td><td>#${r.e.id}</td><td>${esc(r.e.desc)}</td><td>${r.dr?fmt(r.dr):''}</td><td>${r.cr?fmt(r.cr):''}</td><td style="font-weight:700">${balTxt(run,L.nd)}</td></tr>`;}).join('');
const sel=ldMode==='party'
?`<select class="inp" onchange="ldTab=this.value;ldParty=0;render()"><option value="customers" ${ldTab==='customers'?'selected':''}>العملاء</option><option value="suppliers" ${ldTab==='suppliers'?'selected':''}>الموردون</option></select>
<select class="inp" onchange="ldParty=+this.value;render()">${db[ldTab].map(p=>`<option value="${p.id}" ${p.id===ldParty?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`
:`<select class="inp" onchange="ldAcc=this.value;render()">${accOptions(ldAcc).replace('<option value="">— اختر الحساب —</option>','')}</select>`;
return `<div class="topbar"><h1>📖 دفتر الأستاذ / كشف الحساب</h1><div class="no-print"><button class="btn" onclick="window.print()">🖨 طباعة</button> <button class="btn" onclick="exportLedger()">⬇ CSV</button></div></div>
<div class="toolbar"><select class="inp" onchange="ldMode=this.value;render()"><option value="account" ${ldMode==='account'?'selected':''}>حساب من الدليل</option><option value="party" ${ldMode==='party'?'selected':''}>عميل / مورد</option></select>
${sel}<label>من</label><input class="inp" type="date" value="${ldFrom}" onchange="ldFrom=this.value;render()"><label>إلى</label><input class="inp" type="date" value="${ldTo}" onchange="ldTo=this.value;render()"></div>
<div class="panel"><div class="print-hd"><b>${esc(db.settings.shopName)}</b></div><h3>${esc(L.title)}</h3>
<div class="tbl-wrap" style="max-height:calc(100vh - 340px)"><table>
<thead><tr><th>التاريخ</th><th>قيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
<tbody><tr class="je-head"><td colspan="5">رصيد سابق</td><td>${balTxt(L.open,L.nd)}</td></tr>${body||'<tr><td colspan="6" class="empty">لا توجد حركات</td></tr>'}</tbody>
<tfoot><tr class="tot"><td colspan="3">الإجمالي</td><td>${fmt(td)}</td><td>${fmt(tc)}</td><td>${balTxt(run,L.nd)}</td></tr></tfoot></table></div></div>`;
}
function exportLedger(){
const L=ledgerData();let run=L.open;
const rows=[['التاريخ','قيد','البيان','مدين','دائن','الرصيد'],['','','رصيد سابق','','',L.open]];
L.rows.forEach(r=>{run=r2(run+r.v);rows.push([r.e.date,r.e.id,r.e.desc,r.dr,r.cr,run]);});
dl('﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'ledger.csv','text/csv');
}

/* ---- ميزان المراجعة ---- */
let tbFrom='',tbTo=todayStr(),tbAll=false;
function renderTb(){
const T=ledgerTotals(tbFrom,tbTo);let sd=0,sc=0,sbd=0,sbc=0;
const rows=db.accounts.filter(a=>tbAll||T[a.code].d||T[a.code].c).map(a=>{
const t=T[a.code],net=r2(t.d-t.c),bd=net>0?net:0,bc=net<0?-net:0;
sd+=t.d;sc+=t.c;sbd+=bd;sbc+=bc;
return `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${fmt(t.d)}</td><td>${fmt(t.c)}</td><td>${bd?fmt(bd):''}</td><td>${bc?fmt(bc):''}</td></tr>`;}).join('');
const ok=r2(sd)===r2(sc)&&r2(sbd)===r2(sbc);
const A=ledgerTotals(),bookInv=balOf(accByCode('1301'),A['1301']),stockVal=r2(db.items.reduce((s,i)=>s+i.stock*i.cost,0)),diff=r2(stockVal-bookInv);
return `<div class="topbar"><h1>⚖️ ميزان المراجعة</h1><div class="no-print"><button class="btn" onclick="window.print()">🖨 طباعة</button></div></div>
<div class="toolbar"><label>من</label><input class="inp" type="date" value="${tbFrom}" onchange="tbFrom=this.value;render()"><label>إلى</label><input class="inp" type="date" value="${tbTo}" onchange="tbTo=this.value;render()">
<label><input type="checkbox" ${tbAll?'checked':''} onchange="tbAll=this.checked;render()"> إظهار الحسابات الصفرية</label></div>
<div class="panel"><div class="print-hd"><b>${esc(db.settings.shopName)}</b> — ميزان المراجعة حتى ${tbTo}</div>
<div class="tbl-wrap" style="max-height:calc(100vh - 340px)"><table><thead><tr><th>الرقم</th><th>الحساب</th><th>حركة مدين</th><th>حركة دائن</th><th>رصيد مدين</th><th>رصيد دائن</th></tr></thead>
<tbody>${rows||'<tr><td colspan="6" class="empty">لا توجد حركات</td></tr>'}</tbody>
<tfoot><tr class="tot"><td colspan="2">الإجمالي</td><td>${fmt(sd)}</td><td>${fmt(sc)}</td><td>${fmt(sbd)}</td><td>${fmt(sbc)}</td></tr></tfoot></table></div>
<div style="margin-top:12px">${ok?'<span class="badge g">✅ الميزان متوازن (مجموع المدين = مجموع الدائن)</span>':'<span class="badge r">⚠ الميزان غير متوازن</span>'}</div></div>
${Math.abs(diff)>=0.01?`<div class="panel no-print"><h3>📦 مطابقة المخزون</h3><p style="color:var(--muted);margin-bottom:10px">قيمة المخزون في الدفاتر ${money(bookInv)} ، وقيمته حسب الأصناف (الكمية × التكلفة) ${money(stockVal)} — الفرق ${money(diff)}.</p>
<button class="btn pri" onclick="stockAdjust(${diff},'تسوية المخزون مع جرد الأصناف',false);save();render();toast('تمت التسوية ✅')">تسوية الفرق (قيد فروقات جرد)</button></div>`:''}`;
}

/* ---- القوائم المالية ---- */
let finFrom=todayStr().slice(0,8)+'01',finTo=todayStr();
function renderFin(){
const T=ledgerTotals(finFrom,finTo),B=ledgerTotals(null,finTo);
const line=(n,v,b)=>`<tr${b?' class="tot"':''}><td>${n}</td><td>${money(v)}</td></tr>`;
let rev=0,revRows='';
db.accounts.filter(a=>a.type==='revenue').forEach(a=>{const v=balOf(a,T[a.code]);if(!v)return;const s=accNature(a)==='D'?-1:1;rev+=s*v;revRows+=line(esc(a.name)+(s<0?' (يُخصم)':''),s*v);});
const cogs=balOf(accByCode('5101'),T['5101']),gross=r2(rev-cogs);
let exp=0,expRows='';
db.accounts.filter(a=>a.type==='expense'&&a.code!=='5101').forEach(a=>{const v=balOf(a,T[a.code]);if(!v)return;exp+=v;expRows+=line(esc(a.name),v);});
const net=r2(gross-exp);
let as=0,asRows='',li=0,liRows='',eq=0,eqRows='';
db.accounts.filter(a=>a.type==='asset').forEach(a=>{const v=balOf(a,B[a.code]);if(!v)return;as+=v;asRows+=line(esc(a.name),v);});
db.accounts.filter(a=>a.type==='liability').forEach(a=>{const v=balOf(a,B[a.code]);if(!v)return;li+=v;liRows+=line(esc(a.name),v);});
db.accounts.filter(a=>a.type==='equity').forEach(a=>{const v=balOf(a,B[a.code]);if(!v)return;const s=accNature(a)==='D'?-1:1;eq+=s*v;eqRows+=line(esc(a.name)+(s<0?' (يُخصم)':''),s*v);});
const cum=netIncome(B);eq+=cum;eqRows+=line('أرباح (خسائر) الفترة والمرحّلة',cum);
const ok=r2(as)===r2(li+eq);
return `<div class="topbar"><h1>🏦 القوائم المالية</h1><div class="no-print"><button class="btn" onclick="window.print()">🖨 طباعة</button></div></div>
<div class="toolbar"><label>من</label><input class="inp" type="date" value="${finFrom}" onchange="finFrom=this.value;render()"><label>إلى</label><input class="inp" type="date" value="${finTo}" onchange="finTo=this.value;render()"></div>
<div class="grid2">
<div class="panel"><div class="print-hd"><b>${esc(db.settings.shopName)}</b></div><h3>📈 قائمة الدخل (${finFrom} → ${finTo})</h3><table class="fs"><tbody>
<tr class="je-head"><td colspan="2">الإيرادات</td></tr>${revRows||line('لا توجد إيرادات',0)}${line('صافي الإيرادات',rev,1)}
${line('تكلفة البضاعة المباعة',cogs)}${line('مجمل الربح',gross,1)}
<tr class="je-head"><td colspan="2">المصروفات</td></tr>${expRows||line('لا توجد مصروفات',0)}${line('إجمالي المصروفات',exp,1)}
<tr class="tot"><td>${net>=0?'صافي الربح':'صافي الخسارة'}</td><td style="color:${net>=0?'var(--green)':'var(--red)'}">${money(net)}</td></tr></tbody></table></div>
<div class="panel"><h3>🏛️ الميزانية العمومية (حتى ${finTo})</h3><table class="fs"><tbody>
<tr class="je-head"><td colspan="2">الأصول</td></tr>${asRows||line('—',0)}${line('إجمالي الأصول',as,1)}
<tr class="je-head"><td colspan="2">الخصوم</td></tr>${liRows||line('—',0)}${line('إجمالي الخصوم',li,1)}
<tr class="je-head"><td colspan="2">حقوق الملكية</td></tr>${eqRows}${line('إجمالي حقوق الملكية',eq,1)}
${line('الخصوم + حقوق الملكية',li+eq,1)}</tbody></table>
<div style="margin-top:12px">${ok?'<span class="badge g">✅ الميزانية متوازنة (الأصول = الخصوم + حقوق الملكية)</span>':'<span class="badge r">⚠ الميزانية غير متوازنة</span>'}</div></div>
</div>`;
}
