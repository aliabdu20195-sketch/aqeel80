function drawChart(){
const c=document.getElementById('ch');if(!c)return;
const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
const vals=days.map(d=>db.sales.filter(s=>s.date.slice(0,10)===d).reduce((s,x)=>s+x.total,0));
const ctx=c.getContext('2d');
const W=c.width=c.offsetWidth*2,H=c.height=c.offsetHeight*2;ctx.scale(1,1);
const max=Math.max(...vals,1),pad=60,bw=(W-pad*2)/7;
ctx.font='22px Tahoma';ctx.textAlign='center';
days.forEach((d,i)=>{
const h=(H-80)*(vals[i]/max);
ctx.fillStyle='#2563eb';
ctx.beginPath();ctx.roundRect(pad+i*bw+12,H-40-h,bw-24,h,[8,8,0,0]);ctx.fill();
ctx.fillStyle='#1f2937';ctx.fillText(fmt(vals[i]),pad+i*bw+bw/2,H-50-h);
ctx.fillStyle='#6b7280';ctx.fillText(d.slice(5),pad+i*bw+bw/2,H-14);
});
}

const csvCell=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function exportItems(){
const csv='﻿'+['id','name','barcode','category','unit','cost','price','stock','min'].join(',')+'\n'+
db.items.map(i=>[i.id,csvCell(i.name),csvCell(i.barcode||''),csvCell(i.category),csvCell(i.unit),i.cost,i.price,i.stock,i.min].join(',')).join('\n');
dl(csv,'items.csv','text/csv');
}
function parseCsvLine(l){
const out=[];let cur='',inQ=false;
for(let i=0;i<l.length;i++){
const ch=l[i];
if(inQ){
if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else inQ=false;}
else cur+=ch;
}else{
if(ch==='"')inQ=true;
else if(ch===','){out.push(cur);cur='';}
else cur+=ch;
}
}
out.push(cur);return out;
}
function importItems(inp){
const f=inp.files[0];if(!f)return;
const r=new FileReader();
r.onload=e=>{
const lines=e.target.result.replace(/^﻿/,'').split(/\r?\n/).slice(1).filter(Boolean);
let n=0,skipped=0;
lines.forEach(l=>{
const c=parseCsvLine(l);if(c.length<8){skipped++;return;}
const name=(c[1]||'').trim();if(!name){skipped++;return;}
db.items.push({id:db.nextItemId++,name,barcode:c[2]||'',category:c[3]||'مستورد',unit:c[4]||'قطعة',cost:+c[5]||0,price:+c[6]||0,stock:+c[7]||0,min:+c[8]||0});n++;
});
save();renderTable();toast(skipped?`تم استيراد ${n} صنف، وتخطي ${skipped} سطر غير صالح`:`تم استيراد ${n} صنف ✅`);
};
r.readAsText(f);inp.value='';
}

}

<thead><tr><th>رقم</th><th>النوع</th><th>${'الطرف'}</th><th>الأصناف</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>التاريخ</th><th></th></tr></thead>
<tbody>${list.map(x=>`<tr>
<td>${esc(x.number)}</td><td>${x.type==='sale'?'<span class="badge g">بيع</span>':'<span class="badge b">شراء</span>'}</td>
<td>${esc(x.partyName)}</td><td>${x.items.reduce((s,i)=>s+i.qty,0)}</td>
<td>${money(x.total)}</td><td>${money(x.paid)}</td>
<td style="color:${x.total-x.paid>0?'var(--red)':'var(--green)'};font-weight:700">${money(x.total-x.paid)}</td>
<td>${x.date.slice(0,16).replace('T',' ')}</td>
<td><button class="btn sm" onclick="printInvoice('${esc(x.number)}','${x.type}')">🖨 طباعة</button>
<button class="btn sm dng" onclick="delInvoice('${esc(x.number)}','${x.type}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">لا توجد فواتير</td></tr>'}</tbody>
</table></div></div>`;
}
function delInvoice(number,type){
openModal(`<h2>⚠️ حذف فاتورة</h2><p>حذف الفاتورة <b>${number}</b> سيُعيد الكميات للمخزون ويعكس أثرها المالي. متابعة؟</p>
<div class="acts"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn dng" onclick="doDelInv('${number}','${type}')">🗑 حذف</button></div>`);
}
function doDelInv(number,type){
const arr=type==='sale'?db.sales:db.purchases;
const inv=arr.find(x=>x.number===number);if(!inv){closeModal();return;}
inv.items.forEach(l=>{const it=db.items.find(x=>x.id===l.itemId);if(it)it.stock+=type==='sale'?l.qty:-l.qty;});
const party=(type==='sale'?db.customers:db.suppliers).find(x=>x.id===inv.partyId);
if(party)party.balance-=(inv.total-inv.paid)*(type==='sale'?1:-1);
if(type==='sale')db.sales=arr.filter(x=>x.number!==number);else db.purchases=arr.filter(x=>x.number!==number);
save();closeModal();render();toast('تم الحذف');
}

function renderParties(){
return `

<button class="btn ok" style="margin-right:auto" onclick="partyForm('${pTab}')">+ إضافة</button>
</div>
<div class="panel"><div class="tbl-wrap" style="max-height:calc(100vh - 280px)"><table>
<thead><tr><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th>${pTab==='customers'?'مستحق لك':'مستحق له'}</th><th>ملاحظات</th><th></th></tr></thead>
<tbody>${db[pTab].map(p=>`<tr>

<button class="btn sm dng" onclick="delParty('${pTab}',${p.id})">🗑</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد '+(pTab==='customers'?'عملاء':'موردون')+' بعد</td></tr>'}</tbody>
</table></div></div>`;

function partyForm(tab,id){
const p=id?db[tab].find(x=>x.id===id):null;
openModal(`<h2>${p?'✏️ تعديل':'➕ إضافة'} ${tab==='customers'?'عميل':'مورد'}</h2><div class="frm">
<div><label>الاسم *</label><input class="inp" id="p_name" value="${esc(p?p.name:'')}"></div>
<div><label>الهاتف</label><input class="inp" id="p_phone" value="${esc(p?p.phone||'':'')}"></div>
<div class="full"><label>العنوان</label><input class="inp" id="p_addr" value="${esc(p?p.address||'':'')}"></div>
<div class="full"><label>ملاحظات</label><input class="inp" id="p_notes" value="${esc(p?p.notes||'':'')}"></div>
</div><div class="acts"><button class="btn" onclick="closeModal()">إلغاء</button>
<button class="btn ok" onclick="saveParty('${tab}',${id||0})">💾 حفظ</button></div>`);
}
function saveParty(tab,id){
const g=x=>document.getElementById(x).value.trim();
const d={name:g('p_name'),phone:g('p_phone'),address:g('p_addr'),notes:g('p_notes')};
if(!d.name)return toast('أدخل الاسم',false);
if(id)Object.assign(db[tab].find(x=>x.id===id),d);
else db[tab].push({id:nextId(db[tab]),balance:0,...d});
save();closeModal();render();toast('تم الحفظ ✅');
}
function delParty(tab,id){
const p=db[tab].find(x=>x.id===id);
if(Math.abs(p.balance)>0.01)return toast('لا يمكن حذف طرف له رصيد. سدّد أولاً',false);
openModal(`<h2>حذف ${esc(p.name)}؟</h2><div class="acts"><button class="btn" onclick="closeModal()">إلغاء</button>
<button class="btn dng" onclick="db['${tab}']=db['${tab}'].filter(x=>x.id!==${id});save();closeModal();render();toast('تم الحذف')">حذف</button></div>`);
}
function payParty(tab,id){
const p=db[tab].find(x=>x.id===id);
openModal(`<h2>💰 تسديد رصيد: ${esc(p.name)}</h2>
<p>الرصيد الحالي: <b style="color:var(--red)">${money(p.balance)}</b></p>
<div class="frm"><div class="full"><label>المبلغ المسدد</label><input class="inp" type="number" step="0.01" id="pay_amt" value="${Math.abs(p.balance)}"></div></div>
<div class="acts"><button class="btn" onclick="closeModal()">إلغاء</button>
<button class="btn ok" onclick="const a=+document.getElementById('pay_amt').value||0;if(a<=0){toast('أدخل مبلغاً صحيحاً',false);return;}const pp=db['${tab}'].find(x=>x.id===${id});pp.balance+=${tab==='customers'?'-a':'a'};save();closeModal();render();toast('تم التسديد ✅')">💾 حفظ</button></div>`);
}

openModal(`<h2>➕ مصروف جديد</h2><div class="frm">

function saveExp(){
const g=x=>document.getElementById(x).value;

save();closeModal();render();toast('تم الحفظ ✅');
}
/* ---------- التقارير ---------- */
let repFrom=todayStr().slice(0,8)+'01',repTo=todayStr();
function renderReports(){
const sales=db.sales.filter(s=>s.date.slice(0,10)>=repFrom&&s.date.slice(0,10)<=repTo);
const purch=db.purchases.filter(s=>s.date.slice(0,10)>=repFrom&&s.date.slice(0,10)<=repTo);
const exp=db.expenses.filter(s=>s.date>=repFrom&&s.date<=repTo);
const rev=sales.reduce((s,x)=>s+x.total,0);
const cost=sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.cost*i.qty,0),0);
const profit=rev-cost;
const expT=exp.reduce((s,e)=>s+e.amount,0);
const sold={};
sales.forEach(s=>s.items.forEach(i=>{sold[i.name]=(sold[i.name]||0)+i.qty;}));
const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,10);
return `
<div class="topbar"><h1>📈 التقارير</h1></div>
<div class="toolbar">
<label>من</label><input class="inp" type="date" value="${repFrom}" onchange="repFrom=this.value;render()">
<label>إلى</label><input class="inp" type="date" value="${repTo}" onchange="repTo=this.value;render()">
</div>
<div class="cards">
<div class="card g"><div class="lbl">إجمالي المبيعات</div><div class="val">${money(rev)}</div><div class="sub">${sales.length} فاتورة</div></div>
<div class="card ${profit>=0?'g':'r'}"><div class="lbl">مجمل الربح</div><div class="val">${money(profit)}</div><div class="sub">هامش ${rev?Math.round(profit/rev*100):0}%</div></div>
<div class="card b"><div class="lbl">مشتريات</div><div class="val">${money(purch.reduce((s,x)=>s+x.total,0))}</div><div class="sub">${purch.length} فاتورة</div></div>
<div class="card a"><div class="lbl">مصروفات</div><div class="val">${money(expT)}</div><div class="sub">${exp.length} عملية</div></div>
<div class="card ${profit-expT>=0?'g':'r'}"><div class="lbl">صافي الربح</div><div class="val">${money(profit-expT)}</div><div class="sub">بعد المصروفات</div></div>
</div>
<div class="grid2">
<div class="panel"><h3>🏆 الأصناف الأكثر مبيعاً</h3>
${top.length?`<table><thead><tr><th>الصنف</th><th>الكمية المباعة</th></tr></thead><tbody>
${top.map(t=>`<tr><td>${esc(t[0])}</td><td><b>${t[1]}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد مبيعات بالفترة</div>'}
</div>
<div class="panel"><h3>📋 ملخص الفترة</h3><div class="kv">
<div><span>الفترة</span>${repFrom} → ${repTo}</div>
<div><span>متوسط قيمة الفاتورة</span>${money(sales.length?rev/sales.length:0)}</div>
<div><span>إجمالي الأصناف المباعة</span>${sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0)}</div>
<div><span>قيمة المخزون الحالي (تكلفة)</span>${money(db.items.reduce((s,i)=>s+i.stock*i.cost,0))}</div>
<div><span>قيمة المخزون الحالي (بيع)</span>${money(db.items.reduce((s,i)=>s+i.stock*i.price,0))}</div>
<div><span>الأصناف المنخفضة</span>${db.items.filter(i=>i.stock<=i.min).length}</div>
</div></div>
</div>`;
}
/* ---------- النسخ الاحتياطي ---------- */
function renderBackup(){
return `
<div class="topbar"><h1>💾 النسخ الاحتياطي</h1></div>
<div class="grid2">
<div class="panel"><h3>⬇️ تنزيل نسخة احتياطية</h3>
<p style="color:var(--muted);margin-bottom:14px">احفظ ملف JSON على جهازك أو على فلاشة. حجمه صغير ويحتوي كل شيء.</p>
<button class="btn pri" onclick="dl(JSON.stringify(db),'backup-'+todayStr()+'.json','application/json')">⬇ تنزيل النسخة</button>
<hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">
<h3 style="font-size:14px">⚙️ بيانات المؤسسة</h3>
<div class="frm">
<div><label>اسم المؤسسة</label><input class="inp" id="s_shop" value="${esc(db.settings.shopName)}"></div>
<div><label>الهاتف</label><input class="inp" id="s_phone" value="${esc(db.settings.phone)}"></div>
<div class="full"><label>بادئة رقم الفاتورة</label><input class="inp" id="s_pref" value="${esc(db.settings.invPrefix)}"></div>
</div>
<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn ok" onclick="db.settings.shopName=document.getElementById('s_shop').value;db.settings.phone=document.getElementById('s_phone').value;db.settings.invPrefix=document.getElementById('s_pref').value;save();toast('تم الحفظ ✅')">💾 حفظ الإعدادات</button></div>
</div>
<div class="panel"><h3>⬆️ استعادة نسخة احتياطية</h3>
<p style="color:var(--muted);margin-bottom:14px">استرجاع بياناتك كاملة من ملف نسخة سابقة. سيحل محل كل البيانات الحالية.</p>
<label class="btn dng">⚠ استعادة من ملف<input type="file" accept=".json" hidden onchange="restoreBackup(this)"></label>
<hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">
<h3 style="font-size:14px">📊 إحصائيات البيانات</h3>
<div class="kv">
<div><span>الأصناف</span>${db.items.length}</div>
<div><span>فواتير البيع</span>${db.sales.length}</div>
<div><span>فواتير الشراء</span>${db.purchases.length}</div>
<div><span>العملاء</span>${db.customers.length} | الموردون: ${db.suppliers.length}</div>
<div><span>المصروفات</span>${db.expenses.length}</div>
<div><span>حجم البيانات</span>${(JSON.stringify(db).length/1024).toFixed(1)} كيلوبايت</div>
</div>
</div>
</div>`;
}
function restoreBackup(inp){
const f=inp.files[0];if(!f)return;
const r=new FileReader();
r.onload=e=>{
try{
const d=JSON.parse(e.target.result);
if(!d.items||!d.settings)throw 0;
db=d;save();nav('dash');toast('تمت الاستعادة ✅');
}catch(err){toast('ملف غير صالح',false);}
};
r.readAsText(f);inp.value='';
}
/* ---------- المعالج العام ---------- */
function render(){
const m=document.getElementById('main');
if(curScreen==='dash')m.innerHTML=renderDash();
else if(curScreen==='items'){m.innerHTML=renderItems();renderTable();}
else if(curScreen==='sale'){invDraft=[];m.innerHTML=renderInvoice('sale');drawInvLines();}
else if(curScreen==='purchase'){invDraft=[];m.innerHTML=renderInvoice('purchase');drawInvLines();}
else if(curScreen==='invs')m.innerHTML=renderInvs();
else if(curScreen==='parties')m.innerHTML=renderParties();
else if(curScreen==='exp')m.innerHTML=renderExp();
else if(curScreen==='reports')m.innerHTML=renderReports();
else if(curScreen==='backup')m.innerHTML=renderBackup();
if(curScreen==='dash')setTimeout(drawChart,50);
}

<div class="foot">يعمل بدون إنترنت 🔒<br>البيانات محفوظة على جهازك</div>`;
nav('dash');
}
window.onload=init;
